theory: Panpsychism
key: panpsychism
status: core_claims revised and approved 2026-10-11
core_claims:
- id: panpsychism-c1
  text: Experience (or a precursor of experience) is a primitive, non-reducible feature of the fundamental constituents of
    physical reality, as basic as fields and particles, rather than something that appears only in brains.
  source: description
- id: panpsychism-c2
  text: Physics tells us how fundamental fields and particles relate to each other but not what they are in themselves. The
    proposal is that their intrinsic nature is experiential, which places consciousness inside the physical world and gives
    it a causal role.
  source: description
- id: panpsychism-c3
  text: Richer minds arise when micro-level experiential properties combine under the right conditions. How many simple subjects
    or properties add up to one unified larger experience, or how a single cosmic mind is divided into individual ones, is
    the central unsolved difficulty.
  source: description
- id: panpsychism-c4
  text: Proposed ways for small experiencing units to merge into larger ones include synchronised oscillation or resonance,
    with electromagnetic fields serving as the binding medium in biological systems.
  source: description
- id: panpsychism-c5
  text: If experience is not to be explained away, then either the concept of experience or the concept of nature must be
    revised; this view revises nature by placing experience at the fundamental level instead of deflating experience, and
    so avoids both reduction and a separate mental realm.
  source: description
- id: panpsychism-c6
  text: Experience cannot be derived from the arrangement of parts that are entirely non-experiential, so if brains are conscious,
    the matter they are made of must already have an experiential aspect.
  source: description + 2009 Strawson abstract
- id: panpsychism-c7
  text: 'The view comes in versions that differ in what is fundamental: experience in the smallest particles, in the universe
    as a whole, in a field, or in fundamental simple subjects (monads).'
  source: description
